<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Site</title>

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Orbitron', sans-serif;
      background: #0a0a0a;
      color: white;
      text-align: center;
      padding-top: 60px;
    }

    .btn {
      display: inline-block;
      margin: 10px;
      padding: 12px 22px;
      border-radius: 10px;
      background: linear-gradient(90deg, #00f5ff, #0066ff);
      color: white;
      text-decoration: none;
      font-weight: 600;
      transition: 0.2s;
    }

    .btn:hover {
      transform: scale(1.1);
      box-shadow: 0 0 20px #00f5ff;

      .background {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;

        background-image: url("https://4kwallpapers.com/images/walls/thumbs_3t/26343.jpg");
        background-size: cover;
        background-position: center;

        filter: blur(10px);
        transform: scale(1.1);
        z-index: -1;
      }

      .content {
        position: relative;
        text-align: center;
        color: white;
        padding-top: 100px;\
      }
    }
  </style>
</head>

<body>
  <h1>TEST</h1>
  <a href="test.com" class=btn>Test button</a>
  <a href="https://www.playdeadlock.com/oldgods" class=btn>Deadlock (my fav game)</a>
</body>
</html>
