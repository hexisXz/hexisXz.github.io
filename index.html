<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Site</title>

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Orbitron', sans-serif;
      color: white;
      background: transparent;
    }

    .background {
      position: fixed;
      inset: 0;
      background-image: url("pl-p.jpg");
      background-size: cover;
      background-position: center;
      filter: blur(7px);
      transform: scale(1.1);
      z-index: -1;
    }

    .content {
      text-align: center;
      padding-top: 80px;
    }

    .btn {
      display: inline-block;
      margin: 10px;
      padding: 12px 22px;
      border-radius: 10px;
      background: linear-gradient(90deg, #00f5ff, #0066ff);
      color: white;
      text-decoration: none;
      font-weight: 600;
      transition: 0.2s;
    }

    .btn:hover {
      transform: scale(1.1);
      box-shadow: 0 0 20px #00f5ff;
    }
  </style>
</head>

<body>

  <div class="background"></div>

  <div class="content">
    <h1>TEST</h1>

    <a href="https://test.com" class="btn">Test button</a>
    <a href="https://www.playdeadlock.com/oldgods" class="btn">Deadlock</a>
  </div>

</body>
</html>
